<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶蛙栖息地</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

    <!-- ============ 顶部：标题 + 口号 ============ -->
    <header class="header">
        <div class="brand">
            <img src="images/title.png" alt="奶蛙" class="brand-frog">
            <h1>奶蛙栖息地</h1>
            <img src="images/title.png" alt="奶蛙" class="brand-frog">
        </div>
        <p class="slogan">给奶家人一个赛博寄托</p>
    </header>

    <!-- ============ 主体：左边图库 + 右边侧栏 ============ -->
    <main class="main">

        <!-- 左：现有奶蛙 -->
        <section class="gallery">
            <h2 class="gallery-title">现有奶蛙：</h2>

            <div class="frog-grid">
                <!-- ★ 每只奶蛙套一层 .frog-img：
                     外层管"上下浮动"，内层 img 管"悬停缩放"。
                     分成两层，两个 transform 才不会互相覆盖。 -->
                <figure class="frog-card">
                    <div class="frog-img">
                        <img src="images/laugh.png" alt="大笑奶蛙">
                    </div>
                    <figcaption>大笑奶蛙</figcaption>
                </figure>

                <figure class="frog-card">
                    <div class="frog-img">
                        <img src="images/think.png" alt="思考奶蛙">
                    </div>
                    <figcaption>思考奶蛙</figcaption>
                </figure>

                <figure class="frog-card">
                    <div class="frog-img">
                        <img src="images/surprise.png" alt="惊讶奶蛙">
                    </div>
                    <figcaption>惊讶奶蛙</figcaption>
                </figure>

                <figure class="frog-card">
                    <div class="frog-img">
                        <img src="images/serious.png" alt="严肃奶蛙">
                    </div>
                    <figcaption>严肃奶蛙</figcaption>
                </figure>
            </div>
        </section>

        <!-- 右：侧栏 -->
        <aside class="sidebar">
            <p class="side-text">
                更多奶蛙<br>
                期待您的加盟
            </p>

            <p class="side-text">
                技术有限<br>
                招待不周<br>
                敬请谅解
            </p>

            <div class="meme-card">
                <img src="images/meme.jpg" alt="屏幕后面的奶蛙">
            </div>
        </aside>

    </main>

</div>

</body>
</html>
